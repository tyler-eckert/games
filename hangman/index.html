<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#0b0a1f">
  <title>Hangman · Eckerthaus Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/arcade.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('auth-pending')</script>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<main class="cab">
  <div class="bar">
    <a class="menu" href="../">&lt; MENU</a>
    <div class="grow">
      <span id="score">0</span>
      <button class="iconbtn" id="help" type="button" aria-label="How to play">?</button>
    </div>
  </div>
  <header class="marquee compact">
    <div class="sub">ECKERTHAUS ARCADE</div>
    <h1>HANGMAN</h1>
  </header>

  <section class="screen hm-screen">
    <div class="cat" id="cat" aria-live="polite"></div>
    <svg id="gallows" viewBox="0 0 160 180" role="img" aria-label="Hangman drawing">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#7a79bb" stroke-width="5">
          <line x1="12" y1="170" x2="112" y2="170"/><line x1="40" y1="170" x2="40" y2="14"/><line x1="40" y1="14" x2="100" y2="14"/><line x1="100" y1="14" x2="100" y2="34"/>
        </g>
        <g stroke="#ff7be8" stroke-width="5">
          <circle class="part" id="p1" cx="100" cy="48" r="13"/>
          <line class="part" id="p2" x1="100" y1="61" x2="100" y2="110"/>
          <line class="part" id="p3" x1="100" y1="74" x2="80" y2="96"/>
          <line class="part" id="p4" x1="100" y1="74" x2="120" y2="96"/>
          <line class="part" id="p5" x1="100" y1="110" x2="82" y2="144"/>
          <line class="part" id="p6" x1="100" y1="110" x2="118" y2="144"/>
        </g>
      </g>
    </svg>
    <div class="word" id="word" aria-live="polite"></div>
    <div class="info2"><span id="lives">LIVES 6</span><span id="solved">WORDS 0</span></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>

  <div class="keys" id="keys"></div>
  <div class="actions">
    <button class="btn" id="hint" type="button">HINT (-1 LIFE)</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/scores.js"></script>
<script src="../js/howto.js"></script>
<script src="../js/endgame.js"></script>
<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
