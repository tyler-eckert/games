<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a1f">
  <title>Brick Bounce · Eckerthaus Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/arcade.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('auth-pending')</script>
</head>
<body>
<main class="cab">
  <div class="bar">
    <a class="menu" href="../">&lt; MENU</a>
    <div class="grow">
      <button class="iconbtn" id="pause" type="button" aria-label="Pause">II</button>
      <button class="iconbtn" id="help" type="button" aria-label="How to play">?</button>
    </div>
  </div>
  <header class="marquee compact">
    <div class="sub">ECKERTHAUS ARCADE</div>
    <h1>BRICK BOUNCE</h1>
  </header>

  <div class="info"><span id="score">SCORE 0</span><span id="lives">LIVES 3</span><span id="level">LEVEL 1</span></div>

  <section class="screen bb-screen" id="screen">
    <canvas id="c" aria-label="Brick Bounce playfield. Drag to move the paddle, tap to launch the ball."></canvas>
  </section>
  <div class="hint" id="hint">DRAG TO MOVE. TAP TO LAUNCH.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/scores.js"></script>
<script src="../js/howto.js"></script>
<script src="../js/endgame.js"></script>
<script src="game.js"></script>
</body>
</html>
