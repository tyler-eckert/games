<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a1f">
  <title>Spin &amp; Solve · Eckerthaus Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/arcade.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('auth-pending')</script>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<main class="cab">
  <div class="bar">
    <a class="menu" href="../">&lt; MENU</a>
    <div class="grow">
      <span id="total">$0</span>
      <button class="iconbtn" id="help" type="button" aria-label="How to play">?</button>
    </div>
  </div>
  <header class="marquee compact">
    <div class="sub">ECKERTHAUS ARCADE</div>
    <h1>SPIN &amp; SOLVE</h1>
  </header>

  <section class="screen wh-screen">
    <div class="cat" id="cat" aria-live="polite"></div>
    <div class="board" id="board" aria-label="Puzzle board"></div>
    <div class="info"><span id="round">ROUND $0</span><span id="lives">MISSES 0/5</span><span id="pz">PUZZLE 1/3</span></div>
    <div class="wheel-wrap"><canvas id="wheel" aria-label="Prize wheel"></canvas></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>

  <div class="keys" id="keys"></div>

  <div class="actions" id="acts">
    <button class="btn go" id="spin" type="button">SPIN</button>
    <button class="btn" id="vowel" type="button">BUY VOWEL $250</button>
    <button class="btn" id="solve" type="button">SOLVE</button>
  </div>
  <form class="actions" id="solveForm" hidden autocomplete="off">
    <label class="sr" for="guess">Type the whole phrase</label>
    <input id="guess" maxlength="60" placeholder="TYPE THE PHRASE" autocapitalize="characters" spellcheck="false" autocomplete="off">
    <button class="btn go" type="submit" style="flex:0 0 auto;padding:0 14px">GO</button>
    <button class="btn" id="cancelSolve" type="button" style="flex:0 0 auto;padding:0 12px">X</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/scores.js"></script>
<script src="../js/howto.js"></script>
<script src="../js/endgame.js"></script>
<script src="puzzles.js"></script>
<script src="game.js"></script>
</body>
</html>
