<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#0b0a1f">
  <title>Blockfall · Eckerthaus Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/arcade.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('auth-pending')</script>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<main class="cab">
  <div class="bar">
    <a class="menu" href="../">&lt; MENU</a>
    <div class="grow">
      <button class="iconbtn" id="padmode" type="button" aria-label="Switch control layout">D</button>
      <button class="iconbtn" id="pause" type="button" aria-label="Pause">II</button>
      <button class="iconbtn" id="help" type="button" aria-label="How to play">?</button>
    </div>
  </div>
  <header class="marquee compact">
    <div class="sub">ECKERTHAUS ARCADE</div>
    <h1>BLOCKFALL</h1>
  </header>

  <section class="screen bf" id="screen">
    <div class="well" id="well"><canvas id="board" aria-label="Blockfall playfield"></canvas><div class="mult" id="mult" aria-hidden="true"></div></div>
    <aside class="side">
      <div>HOLD<canvas id="hold" width="64" height="48"></canvas></div>
      <div>NEXT<canvas id="next" width="64" height="150"></canvas></div>
      <div class="stat">SCORE<b id="s-score">0</b></div>
      <div class="stat">LINES<b id="s-lines">0</b></div>
      <div class="stat">LEVEL<b id="s-level">1</b></div>
    </aside>
  </section>

  <div class="pad dpad" id="pad">
    <button class="btn" id="b-rot" type="button" aria-label="Drop"><span class="w">DROP</span><span class="s">&#9650;</span></button>
    <button class="btn" id="b-left" type="button" aria-label="Left"><span class="w">LEFT</span><span class="s">&#9664;</span></button>
    <button class="btn" id="b-right" type="button" aria-label="Right"><span class="w">RIGHT</span><span class="s">&#9654;</span></button>
    <button class="btn" id="b-down" type="button" aria-label="Down"><span class="w">DOWN</span><span class="s">&#9660;</span></button>
    <button class="btn" id="b-hold" type="button" aria-label="Hold">HOLD</button>
    <button class="btn go" id="b-drop" type="button" aria-label="Rotate">ROTATE</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/scores.js"></script>
<script src="../js/howto.js"></script>
<script src="../js/endgame.js"></script>
<script src="game.js"></script>
</body>
</html>
