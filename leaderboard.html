<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#0b0a1f">
  <title>Leaderboard · Eckerthaus Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/arcade.css">
  <script>document.documentElement.classList.add('auth-pending')</script>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    .lbpage{display:flex;flex-direction:column;gap:12px}
    .gc{background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:10px}
    .gc.focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(62,240,255,.25)}
    .gc h2{margin:0 0 8px;font-size:10px;font-weight:400;color:var(--cyan);display:flex;justify-content:space-between;gap:8px}
    .gc h2 small{color:var(--mute);font-size:8px}
    .lb{max-height:192px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:4px;padding-right:2px}
    .lb .r{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;min-height:36px;padding:0 10px;background:#14123a;border-radius:6px;font-size:9px;flex:none}
    .lb .r.mine{outline:2px solid var(--amber);color:var(--amber)}
    .lb .r.first .rk{color:var(--amber)}
    .lb .pl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lb .pl small{color:#8c8bd0;font-size:7px;margin-left:6px}
    .lb .msg{font-size:9px;line-height:1.8;color:#8c8bd0;text-align:center;padding:10px 0}
  </style>
</head>
<body>
<main class="cab">
  <header class="marquee" style="padding-top:6px">
    <div class="sub">BEST PER PLAYER</div>
    <h1 style="font-size:18px">LEADERBOARD</h1>
  </header>
  <div class="lbpage" id="page" aria-live="polite"></div>
  <div class="foot"><a class="linkbtn" href="/">BACK TO ARCADE</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/scores.js"></script>
<script>
  var LIST = [
    ['codebreaker','Code-Breaker'],
    ['minesweeper-easy','Minesweeper · Easy'],['minesweeper-medium','Minesweeper · Medium'],['minesweeper-hard','Minesweeper · Hard'],
    ['blockfall','Blockfall'],
    ['solitaire-draw1','Solitaire · Draw 1'],['solitaire-draw3','Solitaire · Draw 3'],
    ['sudoku-easy','Sudoku · Easy'],['sudoku-medium','Sudoku · Medium'],['sudoku-hard','Sudoku · Hard'],['sudoku-daily','Sudoku · Daily'],
    ['wheel','Spin & Solve'],['brickbounce','Brick Bounce'],['hangman','Hangman'],['wahoo','Wahoo'],['ginrummy','Gin Rummy']
  ];
  var page = document.getElementById('page');
  var want = new URLSearchParams(location.search).get('game');
  function cardFor(key, title) {
    var c = document.createElement('section'); c.className = 'gc' + (key === want ? ' focus' : ''); c.id = 'g-' + key;
    var h = document.createElement('h2'); h.textContent = title;
    var sm = document.createElement('small'); sm.textContent = Scores.lower(key) ? 'FASTEST' : 'HIGHEST'; h.appendChild(sm);
    var lb = document.createElement('div'); lb.className = 'lb';
    c.hidden = true;   // stays hidden until the game has at least one score
    c.appendChild(h); c.appendChild(lb); page.appendChild(c);
    return lb;
  }
  function note(lb, t) { lb.textContent = ''; var d = document.createElement('div'); d.className = 'msg'; d.textContent = t; lb.appendChild(d); }
  var pending = 0, shown = 0;
  function settle() {
    if (pending > 0) return;
    var m = document.getElementById('none');
    if (!shown && !m) { m = document.createElement('div'); m.id = 'none'; m.className = 'msg'; m.style.cssText = 'font-size:10px;line-height:2;color:#8c8bd0;text-align:center;padding:30px 0'; m.textContent = navigator.onLine ? 'NO SCORES YET. PLAY A GAME TO GET ON THE BOARD!' : 'YOU ARE OFFLINE. SCORES WILL SHOW WHEN YOU RECONNECT.'; page.appendChild(m); }
    if (shown && m) m.remove();
  }
  function fill(key, lb) {
    pending++;
    Scores.board(key, 50).then(function (rows) {
      pending--;
      if (!rows.length) { settle(); return; }
      lb.parentNode.hidden = false; shown++; settle();
      lb.textContent = '';
      rows.forEach(function (r, i) {
        var d = document.createElement('div');
        d.className = 'r' + (r.mine ? ' mine' : '') + (i === 0 ? ' first' : '');
        var rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = (i + 1) + '.';
        var pl = document.createElement('span'); pl.className = 'pl'; pl.textContent = r.player;
        var ini = document.createElement('small'); ini.textContent = r.initials; pl.appendChild(ini);
        var sc = document.createElement('span'); sc.textContent = Scores.fmt(key, r.score);
        d.appendChild(rk); d.appendChild(pl); d.appendChild(sc);
        lb.appendChild(d);
      });
    }).catch(function () { pending--; settle(); });
  }
  Auth.require().then(function (s) {
    if (!s) return;
    LIST.forEach(function (g) { fill(g[0], cardFor(g[0], g[1])); });
    if (want) setTimeout(function () { var e = document.getElementById('g-' + want); if (e && !e.hidden) e.scrollIntoView({ block: 'start' }); }, 600);
  });
</script>
</body>
</html>
