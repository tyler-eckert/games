<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#0b0a1f">
  <title>Eckerthaus Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/arcade.css">
  <script>document.documentElement.classList.add('auth-pending')</script>
  <style>
    .tile{min-height:104px;padding:12px 6px;gap:10px}
    .tile .name{font-size:9px}
    .tile[hidden]{display:none}
    .tile.live{border:2px solid var(--cyan)}
    .tile .tag{font-size:8px;color:var(--green)}
    .tile .tag.hi{color:var(--amber)}
  </style>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<main class="cab">
  <header class="marquee" style="padding-top:18px">
    <img class="logo" src="/icons/icon.svg" width="72" height="72" alt="" style="image-rendering:pixelated;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 10px rgba(62,240,255,.45))">
    <h1 style="font-size:24px">ECKERTHAUS<br>ARCADE</h1>
    <div class="coin blink" id="coin">INSERT COIN</div>
  </header>

  <section class="screen" style="justify-content:flex-start;min-height:0">
    <div class="grid" id="grid"></div>
  </section>

  <div class="foot"><a class="linkbtn" href="leaderboard.html">LEADERBOARD</a> PLAYER 1 READY <button class="linkbtn" id="out" type="button">SIGN OUT</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/scores.js"></script>
<script>
  var GAMES = [
    { href: 'codebreaker/', name: 'CODE-<br>BREAKER', keys: ['codebreaker'],
      svg: '<circle cx="9" cy="12" r="7" fill="#ff4d5e"/><circle cx="25" cy="12" r="7" fill="#ffc83d"/><circle cx="41" cy="12" r="7" fill="#3ef0ff"/><circle cx="57" cy="12" r="7" fill="#e86bff"/><circle cx="12" cy="31" r="3" fill="#ffc83d"/><circle cx="24" cy="31" r="3" fill="none" stroke="#3ef0ff" stroke-width="2"/>' },
    { href: 'minesweeper/', name: 'MINE-<br>SWEEPER', keys: ['minesweeper-easy', 'minesweeper-medium', 'minesweeper-hard'],
      svg: '<rect x="6" y="4" width="16" height="16" rx="3" fill="#3a38a0"/><rect x="24" y="4" width="16" height="16" rx="3" fill="#07061a" stroke="#2a2870"/><rect x="42" y="4" width="16" height="16" rx="3" fill="#3a38a0"/><rect x="6" y="22" width="16" height="16" rx="3" fill="#07061a" stroke="#2a2870"/><rect x="24" y="22" width="16" height="16" rx="3" fill="#3a38a0"/><rect x="42" y="22" width="16" height="16" rx="3" fill="#07061a" stroke="#2a2870"/><text x="32" y="17" text-anchor="middle" font-size="11" fill="#3ef0ff" font-family="monospace">1</text><text x="14" y="35" text-anchor="middle" font-size="11" fill="#7dff6b" font-family="monospace">2</text><circle cx="50" cy="30" r="4" fill="#ff7be8"/>' },
    { href: 'blockfall/', name: 'BLOCKFALL', keys: ['blockfall'],
      svg: '<rect x="8" y="4" width="12" height="12" fill="#3ef0ff"/><rect x="20" y="4" width="12" height="12" fill="#3ef0ff"/><rect x="32" y="4" width="12" height="12" fill="#3ef0ff"/><rect x="44" y="4" width="12" height="12" fill="#3ef0ff"/><rect x="20" y="22" width="12" height="12" fill="#ffc83d"/><rect x="32" y="22" width="12" height="12" fill="#ffc83d"/>' },
    { href: 'solitaire/', name: 'SOLITAIRE', keys: ['solitaire-draw1', 'solitaire-draw3'],
      svg: '<rect x="8" y="6" width="22" height="30" rx="3" fill="#e9e8ff"/><rect x="34" y="6" width="22" height="30" rx="3" fill="#ff4d5e"/>' },
    { href: 'sudoku/', name: 'SUDOKU', keys: ['sudoku-easy', 'sudoku-medium', 'sudoku-hard', 'sudoku-daily'],
      svg: '<rect x="12" y="2" width="36" height="36" fill="none" stroke="#7dff6b" stroke-width="2"/><line x1="24" y1="2" x2="24" y2="38" stroke="#7dff6b" stroke-width="2"/><line x1="36" y1="2" x2="36" y2="38" stroke="#7dff6b" stroke-width="2"/><line x1="12" y1="14" x2="48" y2="14" stroke="#7dff6b" stroke-width="2"/><line x1="12" y1="26" x2="48" y2="26" stroke="#7dff6b" stroke-width="2"/>' },
    { href: 'wheel/', name: 'SPIN &amp;<br>SOLVE', keys: ['wheel'],
      svg: '<circle cx="32" cy="22" r="17" fill="#4d6bff"/><path d="M32 22 L32 5 A17 17 0 0 1 47 14 Z" fill="#ffc83d"/><path d="M32 22 L47 14 A17 17 0 0 1 49 30 Z" fill="#ff4d5e"/><path d="M32 22 L32 39 A17 17 0 0 1 17 30 Z" fill="#7dff6b"/><path d="M32 22 L17 30 A17 17 0 0 1 15 14 Z" fill="#e86bff"/><circle cx="32" cy="22" r="4" fill="#14123a"/><polygon points="28,1 36,1 32,9" fill="#ffffff"/>' },
    { href: 'brickbounce/', name: 'BRICK<br>BOUNCE', keys: ['brickbounce'],
      svg: '<rect x="6" y="4" width="16" height="7" fill="#e86bff"/><rect x="24" y="4" width="16" height="7" fill="#3ef0ff"/><rect x="42" y="4" width="16" height="7" fill="#ffc83d"/><rect x="15" y="13" width="16" height="7" fill="#7dff6b"/><rect x="33" y="13" width="16" height="7" fill="#ff4d5e"/><circle cx="36" cy="28" r="3" fill="#ffffff"/><rect x="22" y="35" width="20" height="4" rx="2" fill="#3ef0ff"/>' },
    { href: 'hangman/', name: 'HANGMAN', keys: ['hangman'],
      svg: '<g fill="none" stroke-linecap="round" stroke-width="3"><path d="M10 38 H34 M18 38 V4 H40 V9" stroke="#7a79bb"/><circle cx="40" cy="14" r="5" stroke="#ff7be8"/><path d="M40 19 V29 M40 22 L34 27 M40 22 L46 27 M40 29 L35 36" stroke="#ff7be8"/></g>' },
    { href: 'wahoo/', name: 'WAHOO', keys: ['wahoo'],
      svg: '<polygon points="32,3 53,13 53,31 32,41 11,31 11,13" fill="#14123a" stroke="#7a79bb" stroke-width="2"/><circle cx="32" cy="3" r="3" fill="#ff4d5e"/><circle cx="53" cy="13" r="3" fill="#ffc83d"/><circle cx="53" cy="31" r="3" fill="#7dff6b"/><circle cx="32" cy="41" r="3" fill="#3ef0ff"/><circle cx="11" cy="31" r="3" fill="#4d6bff"/><circle cx="11" cy="13" r="3" fill="#e86bff"/><circle cx="32" cy="22" r="4" fill="none" stroke="#ffc83d" stroke-width="2"/>' },
    { href: 'ginrummy/', name: 'GIN<br>RUMMY', keys: ['ginrummy'],
      svg: '<rect x="10" y="8" width="22" height="30" rx="3" fill="#e9e8ff" transform="rotate(-10 21 23)"/><rect x="30" y="6" width="22" height="30" rx="3" fill="#f4f3ff" stroke="#14123a" transform="rotate(8 41 21)"/><text x="41" y="26" text-anchor="middle" font-size="16" fill="#b3123a" font-family="sans-serif" font-weight="bold" transform="rotate(8 41 21)">A</text>' },
    { href: 'banjo/', name: 'BANJO', keys: ['banjo'],
      svg: '<g transform="translate(10.2 .2) scale(.68)"><ellipse cx="13" cy="32" rx="9" ry="16" fill="#e2c88c" stroke="#b79556" stroke-width="2" transform="rotate(12 13 32)"/><ellipse cx="51" cy="32" rx="9" ry="16" fill="#e2c88c" stroke="#b79556" stroke-width="2" transform="rotate(-12 51 32)"/><ellipse cx="32" cy="32" rx="18" ry="19" fill="#fbf5e6" stroke="#d9c48e" stroke-width="2"/><path d="M24 15 Q28 20 32 15 Q36 20 40 15" fill="none" stroke="#efe2bf" stroke-width="2"/><ellipse cx="32" cy="42" rx="11" ry="8.5" fill="#fffaf0"/><circle cx="25" cy="30" r="2.8" fill="#2a1b12"/><circle cx="39" cy="30" r="2.8" fill="#2a1b12"/><circle cx="26" cy="29" r="0.9" fill="#fff"/><circle cx="40" cy="29" r="0.9" fill="#fff"/><ellipse cx="32" cy="38" rx="4" ry="2.8" fill="#1a1210"/><path d="M32 40.5 V44 M32 44 Q28 47.5 24.5 44.5 M32 44 Q36 47.5 39.5 44.5" fill="none" stroke="#5a3b2a" stroke-width="1.6" stroke-linecap="round"/><path d="M29 46 Q32 54 35 46 Z" fill="#ff8aa5"/></g>' },
    { href: 'slide/', name: 'SLIDING<br>TILES', keys: ['slide-3', 'slide-4', 'slide-5'],
      svg: '<rect x="9" y="1" width="12" height="12" rx="2" fill="#ff4d5e"/><rect x="23" y="1" width="12" height="12" rx="2" fill="#ffc83d"/><rect x="37" y="1" width="12" height="12" rx="2" fill="#7dff6b"/><rect x="9" y="15" width="12" height="12" rx="2" fill="#3ef0ff"/><rect x="23" y="15" width="12" height="12" rx="2" fill="#e86bff"/><rect x="37" y="15" width="12" height="12" rx="2" fill="#ff7be8"/><rect x="9" y="29" width="12" height="12" rx="2" fill="#4d6bff"/><rect x="23" y="29" width="12" height="12" rx="2" fill="#ffc83d"/>' },
    { href: 'pipes/', name: 'PIPE<br>CONNECT', keys: ['pipes', 'pipes-race'],
      svg: '<g fill="none" stroke-linecap="round" stroke-width="7"><path d="M4 8 H26 V36 H40" stroke="#3ef0ff"/><path d="M40 36 H60" stroke="#7a79bb"/></g><circle cx="6" cy="8" r="5" fill="#ffc83d"/>' },
    { href: 'kids/', name: 'KIDS', keys: [],
      svg: '<rect x="6" y="8" width="16" height="16" rx="3" fill="#ff7be8"/><rect x="24" y="8" width="16" height="16" rx="3" fill="#3ef0ff"/><rect x="42" y="8" width="16" height="16" rx="3" fill="#ffc83d"/><text x="14" y="21" text-anchor="middle" font-size="12" fill="#0b0a1f" font-family="monospace">A</text><text x="32" y="21" text-anchor="middle" font-size="12" fill="#0b0a1f" font-family="monospace">1</text><text x="50" y="21" text-anchor="middle" font-size="12" fill="#0b0a1f" font-family="monospace">+</text><rect x="14" y="28" width="36" height="6" rx="2" fill="#7dff6b"/>' }
  ];
  var grid = document.getElementById('grid');
  var KIDS_OK = ['c07d695d-b2b8-4cf4-8b9c-3740e6b397d0', '474dbbe0-1c6c-4629-873b-83ec3dfa7a50', 'c93b19a4-f39c-49b5-b52b-fda6df8e08c9', 'ed0fffa8-a785-4025-a774-371b0955ce48'];
  var kidsTile = null;
  GAMES.forEach(function (g) {
    var best = null, bestKey = g.keys[0];
    g.keys.forEach(function (k) {
      var b = Scores.best(k);
      if (b !== null && (best === null || Scores.better(k, b, best))) { best = b; bestKey = k; }
    });
    var a = document.createElement('a');
    a.className = 'tile live';
    a.href = g.href;
    a.innerHTML = '<svg width="64" height="44" viewBox="0 0 64 44" aria-hidden="true">' + g.svg + '</svg>' +
      '<div class="name">' + g.name + '</div>' +
      '<div class="tag' + (best !== null ? ' hi' : '') + '">' + (best !== null ? (Scores.lower(bestKey) ? 'BEST ' : 'HI ') + Scores.fmt(bestKey, best) : 'PLAY') + '</div>';
    if (g.href === 'kids/') { a.hidden = true; kidsTile = a; }
    grid.appendChild(a);
  });
  function paintNet() { document.getElementById('coin').textContent = navigator.onLine ? 'INSERT COIN' : 'OFFLINE MODE'; }
  window.addEventListener('online', paintNet); window.addEventListener('offline', paintNet); paintNet();
  Auth.require().then(function (s) { if (s && s.user && KIDS_OK.indexOf(s.user.id) > -1 && kidsTile) kidsTile.hidden = false; });
  document.getElementById('out').addEventListener('click', function () { Auth.signOut(); });
</script>
</body>
</html>
