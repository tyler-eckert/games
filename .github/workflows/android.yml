# Builds an installable Android app (APK) that contains the whole arcade and needs no internet.
# Run it from the GitHub "Actions" tab (Build Android app -> Run workflow), then download "EckerthausArcade-apk".
name: Build Android app
on:
  workflow_dispatch: {}
  push:
    paths: ['android/**', 'tools/build-lan.py', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Bundle the arcade into the app
        run: |
          python3 tools/build-lan.py
          rm -f _lan/start-arcade.command
          mkdir -p android/app/src/main/assets
          cp -r _lan android/app/src/main/assets/www
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EckerthausArcade-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
