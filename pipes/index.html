<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#0b0a1f">
  <title>Pipe Connect · Eckerthaus Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/arcade.css">
  <link rel="stylesheet" href="../wahoo/style.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('auth-pending')</script>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<main class="cab">
  <div class="bar">
    <a class="menu" href="../">&lt; MENU</a>
    <div class="grow"><button class="iconbtn" id="help" type="button" aria-label="How to play">?</button></div>
  </div>
  <header class="marquee compact">
    <div class="sub">ECKERTHAUS ARCADE</div>
    <h1>PIPE CONNECT</h1>
  </header>

  <section class="screen wa-screen" id="setup">
    <div class="setup">
      <div class="q">GAME MODE</div>
      <div class="seg" id="mode">
        <button class="lv on" type="button" data-n="relaxed">RELAXED</button>
        <button class="lv" type="button" data-n="race">RACE THE OOZE</button>
      </div>
      <div class="note" id="modenote">NO CLOCK. TURN PIPES AT YOUR OWN PACE.</div>
      <button class="big-btn" id="start" type="button">START</button>
    </div>
  </section>
  <div id="game" hidden>
  <section class="screen wa-screen" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="sl-stats"><span id="lvl">LEVEL 1</span><span id="tp">TAPS 0</span></div>
    <div class="goo" id="goo" hidden><div class="gf" id="gf"></div><span id="gt">OOZE</span></div>
    <div class="pp-board" id="board" role="grid" aria-label="Pipe grid"></div>
  </section>
  <div class="bj-msg" id="msg" role="status" aria-live="polite">TAP A PIPE TO TURN IT.</div>
  <div class="sl-btns" id="btns">
    <button class="big-btn alt" id="fresh" type="button">NEW PUZZLE</button>
    <button class="big-btn alt" id="finish" type="button">FINISH</button>
  </div>
  <button class="big-btn" id="next" type="button" hidden>NEXT LEVEL</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/scores.js"></script>
<script src="../js/howto.js"></script>
<script src="../js/endgame.js"></script>
<script src="game.js"></script>
</body>
</html>
